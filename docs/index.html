<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Formatter</title>
  <style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1f242d;
  --border: #2a313c;
  --text: #e7ecf3;
  --muted: #98a2b3;
  --accent: #7cc4ff;
  --accent-2: #5aa6e8;
  --danger: #ff7a7a;
  --ok: #7ce4a4;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
}

header {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.brand {
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
  font-size: 1.05rem;
}

nav { display: flex; gap: 1.25rem; }
nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.95rem;
}
nav a:hover { color: var(--text); }

.status {
  margin-left: auto;
  font-size: 0.85rem;
  color: var(--muted);
}
.status.ready { color: var(--ok); }
.status.error { color: var(--danger); }

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

h1 { font-size: 1.75rem; margin: 0 0 0.4rem; font-weight: 600; }
h2 { font-size: 1.15rem; margin: 0 0 0.3rem; font-weight: 600; }

.lede {
  color: var(--muted);
  margin: 0 0 1.75rem;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
}

.card {
  display: block;
  padding: 1.5rem 1.25rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  text-decoration: none;
  transition: border-color 0.15s, transform 0.05s;
  cursor: pointer;
}
.card:hover { border-color: var(--accent-2); }
.card:active { transform: translateY(1px); }
.card p { margin: 0; color: var(--muted); font-size: 0.95rem; }

.run-form {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  max-width: 520px;
  margin-top: 1rem;
}

.field { display: flex; flex-direction: column; gap: 0.4rem; }
.field > span { font-size: 0.9rem; color: var(--muted); }
.field small { color: var(--muted); font-size: 0.8rem; }

input[type="file"], input[type="number"] {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 0.7rem;
  border-radius: 8px;
  font: inherit;
}
input[type="number"] { width: 140px; }
input:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

.actions { display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem; }

button {
  background: var(--accent);
  color: #08121d;
  border: none;
  border-radius: 8px;
  padding: 0.65rem 1.1rem;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--accent-2); color: #fff; }
button:disabled { opacity: 0.55; cursor: not-allowed; }

.back {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.95rem;
}
.back:hover { color: var(--text); }

.message {
  padding: 0.75rem 1rem;
  border-radius: 8px;
  margin-top: 1rem;
  white-space: pre-wrap;
  font-size: 0.9rem;
}
.message.error {
  background: rgba(255, 122, 122, 0.08);
  border: 1px solid rgba(255, 122, 122, 0.35);
  color: var(--danger);
}
.message.ok {
  background: rgba(124, 228, 164, 0.08);
  border: 1px solid rgba(124, 228, 164, 0.30);
  color: var(--ok);
}
.message.info {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--muted);
}

  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
const EMBEDDED_SCRIPTS = {"airwallex_transactions": "\"\"\"\nprocess_settlement_csv.py\n=========================\nCleans settlement CSVs and **automatically splits the output by currency**.\nNow supports **multi-select** (process many inputs at once) **and lets you choose\nan output folder** for all formatted files.\n\nPer-currency output examples per input file:\n    EUR Transakcijos.csv\n    PLN Transakcijos.csv\n\nWorkflow applied to *each* currency subset\n-----------------------------------------\n1. Drop rows whose **Transaction currency** is empty.\n2. Keep only rows whose **Transaction type** is *Payment*.\n3. Convert **Created at** (column K) using the per-row **Time zone** (column J,\n   values like `UTC+02:00` / `UTC+01:00`) to UTC, then to *Europe/Vilnius*;\n   this automatically handles DST (summer/winter time).\n4. Rename *Created at* \u2192 *Created at LT Laikas*.\n5. Sort rows chronologically (oldest \u2192 newest).\n6. Filter so only rows from the user-chosen month (1\u201312) remain.\n7. Save as ``<CURRENCY> Transakcijos.csv`` **without overwriting**; if a same-named file exists,\n   the script appends ``(2)``, ``(3)``, \u2026 to keep each file.  All outputs go to the folder you pick.\n\nTimestamps are written as ``6/1/25 17:08`` (``%-m/%-d/%y %H:%M`` on POSIX, ``%#m/%#d/%y %H:%M`` on Windows).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport sys\nimport tkinter as tk\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom tkinter import filedialog, messagebox, simpledialog\n\nimport pandas as pd\nfrom zoneinfo import ZoneInfo\n\n# ----------------------------------------------------------------------------\n# Configuration constants\n# ----------------------------------------------------------------------------\nEET = ZoneInfo(\"Etc/GMT-2\")             # legacy fallback: source timestamps expressed at UTC+02:00\nLOCAL_TZ = ZoneInfo(\"Europe/Vilnius\")   # applies DST rules automatically\nDATE_FMT_OUT = \"%#m/%#d/%y %H:%M\" if sys.platform.startswith(\"win\") else \"%-m/%-d/%y %H:%M\"\n\nCOL_CURRENCY = \"Transaction currency\"   # column M\nCOL_TYPE = \"Transaction type\"           # column F\nCOL_CREATED_IN = \"Created at\"           # column K\nCOL_CREATED_OUT = \"Created at LT Laikas\"\nCOL_TIMEZONE = \"Time zone\"              # column J (e.g. 'UTC+02:00', 'UTC+01:00')\n\n# Remembers last-used input/output folders between runs\n_CONFIG_PATH = Path(__file__).resolve().parent / \".settlement_prefs.json\"\n\n\n# ----------------------------------------------------------------------------\n# Persistent folder memory\n# ----------------------------------------------------------------------------\n\ndef _load_prefs() -> dict:\n    try:\n        return json.loads(_CONFIG_PATH.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, json.JSONDecodeError):\n        return {}\n\n\ndef _save_prefs(prefs: dict) -> None:\n    _CONFIG_PATH.write_text(json.dumps(prefs, indent=2), encoding=\"utf-8\")\n\n\n# ----------------------------------------------------------------------------\n# Utility: avoid overwriting existing files\n# ----------------------------------------------------------------------------\n\ndef _unique_path(path: Path) -> Path:\n    if not path.exists():\n        return path\n    stem, suffix = path.stem, path.suffix\n    i = 2\n    while True:\n        candidate = path.with_name(f\"{stem} ({i}){suffix}\")\n        if not candidate.exists():\n            return candidate\n        i += 1\n\n\n@dataclass(slots=True)\nclass Cleaner:\n    \"\"\"Cleans a DataFrame for a single currency.\"\"\"\n\n    df: pd.DataFrame\n    month: int  # 1\u201312\n\n    # ---------------------------------------------------------------------\n    def process(self) -> pd.DataFrame:\n        df = self.df.copy()\n\n        # 2. Keep only \"Payment\" rows -------------------------------------------------\n        df = df[df[COL_TYPE].eq(\"Payment\")]\n        if df.empty:\n            return df\n\n        # 3. Parse & convert timestamps -----------------------------------------------\n        dt_created = self._parse_convert(df[COL_CREATED_IN], df.get(COL_TIMEZONE))\n\n        # 6. Filter by month -----------------------------------------------------------\n        mask = dt_created.dt.month.eq(self.month)\n        df = df[mask].copy()\n        dt_created = dt_created[mask]\n        if df.empty:\n            return df\n\n        # 5. Sort chronologically ------------------------------------------------------\n        df[\"__dt__\"] = dt_created\n        df = df.sort_values(\"__dt__\")\n\n        # 4. Finalise timestamp column -------------------------------------------------\n        df[COL_CREATED_IN] = dt_created.dt.strftime(DATE_FMT_OUT)\n        df = df.rename(columns={COL_CREATED_IN: COL_CREATED_OUT})\n        return df.drop(columns=\"__dt__\")\n\n    # ------------------------------------------------------------ helper ----------\n    def _parse_convert(self, series: pd.Series, tz_series: pd.Series | None) -> pd.Series:\n        \"\"\"\n        Parse naive timestamps in `series` and convert them to Europe/Vilnius.\n\n        If `tz_series` is provided (e.g. column \"Time zone\" with values like\n        'UTC+02:00' / 'UTC+01:00'), we:\n          - interpret `Created at` as local time in that offset,\n          - convert to UTC,\n          - then to Europe/Vilnius (LOCAL_TZ), which handles DST correctly.\n\n        If `tz_series` is missing, we fall back to the old behaviour: treat\n        all times as fixed UTC+02:00 (EET) and convert to LOCAL_TZ.\n        \"\"\"\n        dt_parsed = pd.to_datetime(series, errors=\"coerce\", utc=False)\n        if dt_parsed.isna().any():\n            bad = series[dt_parsed.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable timestamps (samples): \" + \", \".join(map(str, bad))\n            )\n\n        # If we don't have a time-zone column, behave as before (fixed UTC+02).\n        if tz_series is None:\n            return dt_parsed.dt.tz_localize(EET).dt.tz_convert(LOCAL_TZ)\n\n        # Example values: 'UTC+02:00', 'UTC+01:00'\n        tz_str = tz_series.astype(str)\n        # Extract the hour part (+02, +01, etc.) as an integer.\n        match = tz_str.str.extract(r\"UTC([+-]\\d+):\")[0]\n\n        if match.isna().any():\n            bad = tz_str[match.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable time-zone values (samples): \" + \", \".join(map(str, bad))\n            )\n\n        offsets = match.astype(int)\n\n        # Local time -> UTC: local = UTC + offset  =>  UTC = local - offset\n        utc_dt = dt_parsed - pd.to_timedelta(offsets, unit=\"h\")\n        utc_dt = utc_dt.dt.tz_localize(\"UTC\")\n\n        # UTC -> Europe/Vilnius (handles DST, so summer vs winter is correct)\n        return utc_dt.dt.tz_convert(LOCAL_TZ)\n\n\n# ----------------------------------------------------------------------------\n# Core functions\n# ----------------------------------------------------------------------------\n\ndef run_split(src_path: Path, month: int, dest_dir: Path) -> list[Path]:\n    df_all = pd.read_csv(src_path)\n\n    # 1. Drop rows without currency --------------------------------------------------\n    df_all = df_all[\n        df_all[COL_CURRENCY].notna()\n        & df_all[COL_CURRENCY].astype(str).str.strip().ne(\"\")\n    ]\n    if df_all.empty:\n        raise ValueError(\"The file contains no rows with Transaction currency.\")\n\n    outputs: list[Path] = []\n    # Process each currency subset ----------------------------------------------------\n    for currency_code, df_curr in df_all.groupby(COL_CURRENCY, sort=False):\n        cleaned = Cleaner(df_curr, month).process()\n        if cleaned.empty:\n            continue  # nothing for this currency in the selected month\n        out_name = f\"{currency_code.strip()} Transakcijos{src_path.suffix}\"\n        out_path = _unique_path(dest_dir / out_name)\n        cleaned.to_csv(out_path, index=False, encoding=\"utf-8-sig\")\n        outputs.append(out_path)\n    return outputs\n\n\ndef run_batch(file_paths: list[Path], month: int, dest_dir: Path) -> tuple[list[Path], list[str]]:\n    outputs: list[Path] = []\n    errors: list[str] = []\n    for p in file_paths:\n        try:\n            outputs.extend(run_split(p, month, dest_dir))\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f\"\\u2716 {p.name}: {exc}\")\n    return outputs, errors\n\n\n# ----------------------------------------------------------------------------\n# Tkinter UI glue (multi-select + choose output folder)\n# ----------------------------------------------------------------------------\n\ndef main() -> None:\n    root = tk.Tk()\n    root.withdraw()  # dialogs only\n\n    prefs = _load_prefs()\n\n    # Pick one or many CSV files (start from last-used input folder)\n    file_paths = filedialog.askopenfilenames(\n        title=\"Select one or more settlement CSV files\",\n        filetypes=[(\"CSV files\", \"*.csv\"), (\"All files\", \"*.*\")],\n        initialdir=prefs.get(\"last_input_dir\"),\n    )\n    if not file_paths:\n        return  # user cancelled\n\n    # Remember where the user picked files from\n    prefs[\"last_input_dir\"] = str(Path(file_paths[0]).parent)\n\n    # Choose destination folder for all outputs (start from last-used output folder,\n    # or fall back to where the input files live)\n    fallback_dir = prefs.get(\"last_output_dir\") or prefs[\"last_input_dir\"]\n    dest = filedialog.askdirectory(\n        title=\"Select output folder for formatted files\",\n        mustexist=True,\n        initialdir=fallback_dir,\n    )\n    if not dest:\n        # Fall back to the first file's folder\n        first_parent = str(Path(file_paths[0]).parent)\n        messagebox.showinfo(\n            \"No folder selected\",\n            f\"No output folder chosen. Saving next to the first input file:\\n{first_parent}\",\n            parent=root,\n        )\n        dest_dir = Path(first_parent)\n    else:\n        dest_dir = Path(dest)\n\n    # Remember the output folder\n    prefs[\"last_output_dir\"] = str(dest_dir)\n    _save_prefs(prefs)\n\n    month = simpledialog.askinteger(\n        \"Pick month\",\n        \"Enter month number (1\u201312) to retain:\",\n        parent=root,\n        minvalue=1,\n        maxvalue=12,\n    )\n    if month is None:\n        return\n\n    outputs, errors = run_batch([Path(p) for p in file_paths], month, dest_dir)\n\n    # Summarise results\n    msg_lines = [f\"Saved {len(outputs)} file(s) to:\\n{dest_dir}\"]\n    if outputs:\n        msg_lines.append(\"\")\n        msg_lines.extend(str(p.name) for p in outputs)\n    if errors:\n        msg_lines.append(\"\\nSkipped with errors:\")\n        msg_lines.extend(errors)\n\n    messagebox.showinfo(\"Done\", \"\\n\".join(msg_lines), parent=root)\n\n\nif __name__ == \"__main__\":\n    main()", "airwallex_frozen": "\"\"\"\nprocess_settlement_csv_split.py\n===============================\nCleans settlement CSVs **and** automatically splits the output by currency, producing\none file per distinct value in column **M \u2013 Transaction currency**.\n\nNow supports:\n* **Multi-select** \u2013 pick one **or many** CSVs and it will process them all.\n* **Choose output folder** \u2013 all formatted files are saved where you choose.\n* **No overwrites** \u2013 if a filename already exists, the script appends (2), (3), \u2026\n\nPer-currency outputs look like:\n    EUR U\u017esaldytos.csv\n    NOK U\u017esaldytos.csv\n\nWorkflow applied to *each* currency-specific subset:\n\n1. Drop rows whose **Transaction currency** is empty.\n2. Keep only rows whose **Transaction type** is \"Payment\".\n3. Convert **Settled at** (column L) using the per-row **Time zone** (column J,\n   values like `UTC+02:00` / `UTC+01:00`) to UTC, then to Europe/Vilnius; this\n   automatically handles summer/winter time (DST).\n4. Rename column to **Settled at LT Laikas**.\n5. Sort rows by that timestamp (oldest \u2192 newest).\n6. Convert **Created at** (column K) in the same way; rename to **Created at LT Laikas**.\n7. Retain only rows whose *Created at* month = **X** (user-chosen) **and** whose\n   *Settled at* month = **Y** (user-chosen).\n8. Save the cleaned subset as ``<CURRENCY> U\u017esaldytos.csv`` in the chosen folder.\n\nRun the script, pick **one or more** CSVs, enter month X and month Y, choose an output folder.\nA summary lists all generated files and any inputs that were skipped with errors.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport sys\nimport tkinter as tk\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom tkinter import filedialog, messagebox, simpledialog\n\nimport pandas as pd\nfrom zoneinfo import ZoneInfo\n\n# ----------------------------------------------------------------------------\n# Configuration ----------------------------------------------------------------\n# ----------------------------------------------------------------------------\nEET = ZoneInfo(\"Etc/GMT-2\")             # legacy fallback: fixed UTC+02:00 if no Time zone column\nLOCAL_TZ = ZoneInfo(\"Europe/Vilnius\")   # applies DST automatically\nDATE_FMT_OUT = \"%#m/%#d/%y %H:%M\" if sys.platform.startswith(\"win\") else \"%-m/%-d/%y %H:%M\"\n\n# Column names (matching sample files) -----------------------------------------\nCOL_CURRENCY = \"Transaction currency\"   # column M\nCOL_TYPE = \"Transaction type\"           # column F\nCOL_CREATED_IN = \"Created at\"           # column K\nCOL_SETTLED_IN = \"Settled at\"           # column L\nCOL_TIMEZONE = \"Time zone\"              # column J (e.g. 'UTC+02:00', 'UTC+01:00')\n\nCOL_CREATED_OUT = \"Created at LT Laikas\"\nCOL_SETTLED_OUT = \"Settled at LT Laikas\"\n\n# Remembers last-used input/output folders between runs\n_CONFIG_PATH = Path(__file__).resolve().parent / \".settlement_split_prefs.json\"\n\n\n# ----------------------------------------------------------------------------\n# Persistent folder memory\n# ----------------------------------------------------------------------------\n\ndef _load_prefs() -> dict:\n    try:\n        return json.loads(_CONFIG_PATH.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, json.JSONDecodeError):\n        return {}\n\n\ndef _save_prefs(prefs: dict) -> None:\n    _CONFIG_PATH.write_text(json.dumps(prefs, indent=2), encoding=\"utf-8\")\n\n\n# ----------------------------------------------------------------------------\n# Utility: ensure unique filenames in the destination folder\n# ----------------------------------------------------------------------------\n\ndef _unique_path(path: Path) -> Path:\n    if not path.exists():\n        return path\n    stem, suffix = path.stem, path.suffix\n    i = 2\n    while True:\n        candidate = path.with_name(f\"{stem} ({i}){suffix}\")\n        if not candidate.exists():\n            return candidate\n        i += 1\n\n\n@dataclass(slots=True)\nclass Cleaner:\n    \"\"\"Applies the full cleaning workflow to a DataFrame subset.\"\"\"\n\n    df: pd.DataFrame\n    month_created: int  # 1\u201312\n    month_settled: int  # 1\u201312\n\n    # ---------------------------------------------------------------------\n    def process(self) -> pd.DataFrame:\n        df = self.df.copy()\n\n        # 2. Keep only Payment rows ----------------------------------------------------\n        df = df[df[COL_TYPE].eq(\"Payment\")]\n        if df.empty:\n            return df\n\n        # Use the same Time zone column for both Created and Settled -------------------\n        tz_series = df.get(COL_TIMEZONE)\n\n        # 3 & 6. Parse and convert timestamps -----------------------------------------\n        dt_created = self._parse_convert(df[COL_CREATED_IN], tz_series)\n        dt_settled = self._parse_convert(df[COL_SETTLED_IN], tz_series)\n\n        # 7. Filter by months ----------------------------------------------------------\n        mask = dt_created.dt.month.eq(self.month_created) & dt_settled.dt.month.eq(self.month_settled)\n        df = df[mask].copy()\n        dt_created = dt_created[mask]\n        dt_settled = dt_settled[mask]\n        if df.empty:\n            return df\n\n        # 5. Sort by Settled timestamp -------------------------------------------------\n        df[\"__dt_settled__\"] = dt_settled\n        df = df.sort_values(\"__dt_settled__\")\n\n        # 4 & 6. Finalise timestamp columns & rename -----------------------------------\n        df[COL_SETTLED_IN] = dt_settled.dt.strftime(DATE_FMT_OUT)\n        df[COL_CREATED_IN] = dt_created.dt.strftime(DATE_FMT_OUT)\n        df = df.rename(columns={\n            COL_SETTLED_IN: COL_SETTLED_OUT,\n            COL_CREATED_IN: COL_CREATED_OUT,\n        })\n        return df.drop(columns=\"__dt_settled__\")\n\n    # ---------------------------------------------------------------- helper ---------\n    def _parse_convert(self, series: pd.Series, tz_series: pd.Series | None) -> pd.Series:\n        \"\"\"\n        Parse naive timestamps in `series` and convert them to Europe/Vilnius.\n\n        If `tz_series` is provided (e.g. column \"Time zone\" with values like\n        'UTC+02:00' / 'UTC+01:00'), we:\n          - interpret the timestamp as local time in that offset,\n          - convert to UTC,\n          - then to Europe/Vilnius (LOCAL_TZ), which handles DST correctly.\n\n        If `tz_series` is missing, we fall back to the old behaviour: treat\n        all times as fixed UTC+02:00 (EET) and convert to LOCAL_TZ.\n        \"\"\"\n        dt_parsed = pd.to_datetime(series, errors=\"coerce\", utc=False)\n        if dt_parsed.isna().any():\n            bad = series[dt_parsed.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable timestamps (samples): \" + \", \".join(map(str, bad))\n            )\n\n        # If we don't have a time-zone column, behave as before (fixed UTC+02).\n        if tz_series is None:\n            return dt_parsed.dt.tz_localize(EET).dt.tz_convert(LOCAL_TZ)\n\n        # Example values: 'UTC+02:00', 'UTC+01:00'\n        tz_str = tz_series.astype(str)\n        # Extract the hour part (+02, +01, etc.) as an integer.\n        match = tz_str.str.extract(r\"UTC([+-]\\d+):\")[0]\n\n        if match.isna().any():\n            bad = tz_str[match.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable time-zone values (samples): \" + \", \".join(map(str, bad))\n            )\n\n        offsets = match.astype(int)\n\n        # Local time -> UTC: local = UTC + offset  =>  UTC = local - offset\n        utc_dt = dt_parsed - pd.to_timedelta(offsets, unit=\"h\")\n        utc_dt = utc_dt.dt.tz_localize(\"UTC\")\n\n        # UTC -> Europe/Vilnius (handles DST, so summer vs winter is correct)\n        return utc_dt.dt.tz_convert(LOCAL_TZ)\n\n\n# ----------------------------------------------------------------------------\n# Main application logic (per file) -------------------------------------------\n# ----------------------------------------------------------------------------\n\ndef run_one(src_path: Path, month_created: int, month_settled: int, dest_dir: Path) -> list[Path]:\n    \"\"\"Return list of output file paths for a single input file.\"\"\"\n    df_all = pd.read_csv(src_path)\n\n    # 1. Drop rows without currency ---------------------------------------------------\n    df_all = df_all[\n        df_all[COL_CURRENCY].notna()\n        & df_all[COL_CURRENCY].astype(str).str.strip().ne(\"\")\n    ]\n    if df_all.empty:\n        raise ValueError(\"The file contains no rows with Transaction currency.\")\n\n    outputs: list[Path] = []\n    for currency_code, df_curr in df_all.groupby(COL_CURRENCY, sort=False):\n        cleaned = Cleaner(df_curr, month_created, month_settled).process()\n        if cleaned.empty:\n            # Nothing matches the month filters; skip creating an empty file.\n            continue\n        out_name = f\"{currency_code.strip()} U\u017esaldytos{src_path.suffix}\"\n        out_path = _unique_path(dest_dir / out_name)\n        cleaned.to_csv(out_path, index=False, encoding=\"utf-8-sig\")\n        outputs.append(out_path)\n    return outputs\n\n\ndef run_batch(file_paths: list[Path], month_created: int, month_settled: int, dest_dir: Path) -> tuple[list[Path], list[str]]:\n    outputs: list[Path] = []\n    errors: list[str] = []\n    for p in file_paths:\n        try:\n            outputs.extend(run_one(p, month_created, month_settled, dest_dir))\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f\"\\u2716 {p.name}: {exc}\")\n    return outputs, errors\n\n\n# ----------------------------------------------------------------------------\n# Tiny Tkinter UI (multi-select + choose output folder) -----------------------\n# ----------------------------------------------------------------------------\n\ndef main() -> None:\n    root = tk.Tk()\n    root.withdraw()  # we only need dialogs\n\n    prefs = _load_prefs()\n\n    # Pick one or many CSV files (start from last-used input folder)\n    file_paths = filedialog.askopenfilenames(\n        title=\"Select one or more settlement CSV files\",\n        filetypes=[(\"CSV files\", \"*.csv\"), (\"All files\", \"*.*\")],\n        initialdir=prefs.get(\"last_input_dir\"),\n    )\n    if not file_paths:\n        return  # user cancelled\n\n    # Remember where the user picked files from\n    prefs[\"last_input_dir\"] = str(Path(file_paths[0]).parent)\n\n    month_created = simpledialog.askinteger(\n        \"Pick month X (Created)\",\n        \"Enter month number (1\u201312) to keep for *Created at*:\",\n        parent=root,\n        minvalue=1,\n        maxvalue=12,\n    )\n    if month_created is None:\n        return\n\n    month_settled = simpledialog.askinteger(\n        \"Pick month Y (Settled)\",\n        \"Enter month number (1\u201312) to keep for *Settled at*:\",\n        parent=root,\n        minvalue=1,\n        maxvalue=12,\n    )\n    if month_settled is None:\n        return\n\n    # Choose destination folder (start from last-used output folder,\n    # or fall back to where the input files live)\n    fallback_dir = prefs.get(\"last_output_dir\") or prefs[\"last_input_dir\"]\n    dest = filedialog.askdirectory(\n        title=\"Select output folder for formatted files\",\n        mustexist=True,\n        initialdir=fallback_dir,\n    )\n    if not dest:\n        # Fall back to the first file's folder\n        dest_dir = Path(file_paths[0]).parent\n        messagebox.showinfo(\n            \"No folder selected\",\n            f\"No output folder chosen. Saving next to the first input file:\\n{dest_dir}\",\n            parent=root,\n        )\n    else:\n        dest_dir = Path(dest)\n\n    # Remember the output folder\n    prefs[\"last_output_dir\"] = str(dest_dir)\n    _save_prefs(prefs)\n\n    outputs, errors = run_batch([Path(p) for p in file_paths], month_created, month_settled, dest_dir)\n\n    # Summarise results\n    msg_lines = [f\"Saved {len(outputs)} file(s) to:\\n{dest_dir}\"]\n    if outputs:\n        msg_lines.append(\"\")\n        msg_lines.extend(p.name for p in outputs)\n    if errors:\n        msg_lines.append(\"\\nSkipped with errors:\")\n        msg_lines.extend(errors)\n\n    messagebox.showinfo(\"Done\", \"\\n\".join(msg_lines), parent=root)\n\n\nif __name__ == \"__main__\":\n    main()", "paypal_all": "\"\"\"\nprocess_csr_lt_month.py\n=======================\nTakes PayPal CSR CSV files where Date/Time are in the CSR time zone\n(e.g. America/Los_Angeles), converts them to Europe/Vilnius time and\nkeeps only the rows that fall into a user-chosen month (based on LT time).\n\nFeatures:\n- Multi-select: pick one or many CSR CSV files.\n- Choose output folder.\n- No overwrites: if a filename already exists, appends (2), (3), \u2026\n\nFor each input file, outputs ONE CSV named:\n    Visos transakcijos pagal LT laiko zona.csv\n(or \"Visos transakcijos pagal LT laiko zona (2).csv\", etc. if needed)\n\nWorkflow per file:\n1. Combine \"Date\" + \"Time\" and parse as datetimes.\n2. Interpret those as local times in the file's \"Time Zone\" (e.g. America/Los_Angeles),\n   using Python's zoneinfo (handles DST, including summer/winter changes).\n3. Convert to Europe/Vilnius.\n4. Filter rows where LT month == user-chosen month (1\u201312).\n5. Sort rows chronologically by LT time.\n6. Add a column \"DateTime LT Laikas\" formatted as 6/1/25 17:08.\n7. Save the filtered file in the chosen folder.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport sys\nimport tkinter as tk\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom tkinter import filedialog, messagebox, simpledialog\n\nimport pandas as pd\nfrom zoneinfo import ZoneInfo\n\n# ----------------------------------------------------------------------------\n# Configuration\n# ----------------------------------------------------------------------------\n\nDATE_COL = \"Date\"\nTIME_COL = \"Time\"\nTZ_COL = \"Time Zone\"\n\nLT_TZ = ZoneInfo(\"Europe/Vilnius\")  # target timezone with DST rules\n\n# CSV-friendly datetime format, same style as other scripts\nDATE_FMT_OUT = \"%#m/%#d/%y %H:%M\" if sys.platform.startswith(\"win\") else \"%-m/%-d/%y %H:%M\"\n\n# Remembers last-used input/output folders between runs\n_CONFIG_PATH = Path(__file__).resolve().parent / \".all_transactions_prefs.json\"\n\n\n# ----------------------------------------------------------------------------\n# Persistent folder memory\n# ----------------------------------------------------------------------------\n\ndef _load_prefs() -> dict:\n    try:\n        return json.loads(_CONFIG_PATH.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, json.JSONDecodeError):\n        return {}\n\n\ndef _save_prefs(prefs: dict) -> None:\n    _CONFIG_PATH.write_text(json.dumps(prefs, indent=2), encoding=\"utf-8\")\n\n\n# ----------------------------------------------------------------------------\n# Utility: ensure unique filenames in the destination folder\n# ----------------------------------------------------------------------------\n\ndef _unique_path(path: Path) -> Path:\n    \"\"\"Return a path that does not yet exist, appending (2), (3), ... if needed.\"\"\"\n    if not path.exists():\n        return path\n    stem, suffix = path.stem, path.suffix\n    i = 2\n    while True:\n        candidate = path.with_name(f\"{stem} ({i}){suffix}\")\n        if not candidate.exists():\n            return candidate\n        i += 1\n\n\n@dataclass(slots=True)\nclass Cleaner:\n    \"\"\"Convert CSR times to LT time, filter by LT month, and sort chronologically.\"\"\"\n\n    df: pd.DataFrame\n    month: int  # 1\u201312\n\n    # ---------------------------------------------------------------------\n    def process(self) -> pd.DataFrame:\n        df = self.df.copy()\n\n        # Parse and convert to LT time ------------------------------------\n        dt_lt = self._parse_and_convert_to_lt(df)\n\n        # Filter by LT month ----------------------------------------------\n        mask = dt_lt.dt.month.eq(self.month)\n        df = df[mask].copy()\n        dt_lt = dt_lt[mask]\n        if df.empty:\n            return df\n\n        # Sort chronologically by LT time ---------------------------------\n        df[\"__dt_lt__\"] = dt_lt\n        df = df.sort_values(\"__dt_lt__\")\n\n        # Expose a formatted LT datetime column ---------------------------\n        df[\"DateTime LT Laikas\"] = df[\"__dt_lt__\"].dt.strftime(DATE_FMT_OUT)\n\n        return df.drop(columns=\"__dt_lt__\")\n\n    # ---------------------------------------------------------------- helper\n    def _parse_and_convert_to_lt(self, df: pd.DataFrame) -> pd.Series:\n        \"\"\"\n        Combine Date + Time, interpret them in the CSR time zone from TZ_COL,\n        and convert to Europe/Vilnius.\n\n        Uses Python's zoneinfo on each timestamp, which avoids the pandas\n        tz_localize() ambiguity error at DST transitions.\n        \"\"\"\n        # Combine Date + Time as strings\n        combined = (\n            df[DATE_COL].astype(str).str.strip()\n            + \" \"\n            + df[TIME_COL].astype(str).str.strip()\n        )\n\n        # Parse naive datetimes (CSR uses m/d/Y H:M:S)\n        dt_naive = pd.to_datetime(\n            combined,\n            format=\"%m/%d/%Y %H:%M:%S\",\n            errors=\"coerce\",\n        )\n        if dt_naive.isna().any():\n            bad = combined[dt_naive.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable Date/Time values (samples): \" + \", \".join(map(str, bad))\n            )\n\n        # Detect source timezone from the file (e.g. \"America/Los_Angeles\")\n        if TZ_COL not in df.columns:\n            raise ValueError(f\"Column '{TZ_COL}' not found in CSR file.\")\n\n        tz_values = df[TZ_COL].dropna().unique()\n        if len(tz_values) == 0:\n            raise ValueError(\"No non-empty values found in 'Time Zone' column.\")\n        src_tz_name = str(tz_values[0])\n        try:\n            src_tz = ZoneInfo(src_tz_name)\n        except Exception as exc:  # noqa: BLE001\n            raise ValueError(f\"Unknown time zone {src_tz_name!r}: {exc}\") from exc\n\n        # Convert each timestamp using Python's zoneinfo directly ----------\n        lt_list = []\n        for ts in dt_naive:\n            # ts is a pandas Timestamp (naive); convert to Python datetime\n            py = ts.to_pydatetime().replace(tzinfo=src_tz)\n            lt_list.append(py.astimezone(LT_TZ))\n\n        return pd.Series(lt_list, index=df.index)\n\n\n# ----------------------------------------------------------------------------\n# Core logic\n# ----------------------------------------------------------------------------\n\ndef run_one(src_path: Path, month: int, dest_dir: Path) -> list[Path]:\n    \"\"\"Process a single CSR CSV. Returns list of output file paths (0 or 1).\"\"\"\n    df_all = pd.read_csv(src_path)\n\n    cleaned = Cleaner(df_all, month).process()\n    if cleaned.empty:\n        # Nothing in that LT month; no output file\n        return []\n\n    # Always use the same base filename\n    base_name = \"Visos transakcijos pagal LT laiko zona.csv\"\n    out_path = _unique_path(dest_dir / base_name)\n    cleaned.to_csv(out_path, index=False, encoding=\"utf-8-sig\")\n    return [out_path]\n\n\ndef run_batch(file_paths: list[Path], month: int, dest_dir: Path) -> tuple[list[Path], list[str]]:\n    \"\"\"Process multiple files; collect outputs and any error messages.\"\"\"\n    outputs: list[Path] = []\n    errors: list[str] = []\n    for p in file_paths:\n        try:\n            outputs.extend(run_one(p, month, dest_dir))\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f\"\\u2716 {p.name}: {exc}\")\n    return outputs, errors\n\n\n# ----------------------------------------------------------------------------\n# Tiny Tkinter UI (multi-select + choose output folder) -----------------------\n# ----------------------------------------------------------------------------\n\ndef main() -> None:\n    root = tk.Tk()\n    root.withdraw()  # dialogs only\n\n    prefs = _load_prefs()\n\n    # Pick one or many CSR CSV files (start from last-used input folder)\n    file_paths = filedialog.askopenfilenames(\n        title=\"Select one or more PayPal CSR CSV files\",\n        filetypes=[(\"CSV files\", \"*.csv\"), (\"All files\", \"*.*\")],\n        initialdir=prefs.get(\"last_input_dir\"),\n    )\n    if not file_paths:\n        return  # user cancelled\n\n    # Remember where the user picked files from\n    prefs[\"last_input_dir\"] = str(Path(file_paths[0]).parent)\n\n    # Ask for LT month number\n    month = simpledialog.askinteger(\n        \"Pick month (LT time)\",\n        \"Enter month number (1\u201312) to retain (based on LT time):\",\n        parent=root,\n        minvalue=1,\n        maxvalue=12,\n    )\n    if month is None:\n        return\n\n    # Choose destination folder (start from last-used output folder,\n    # or fall back to where the input files live)\n    fallback_dir = prefs.get(\"last_output_dir\") or prefs[\"last_input_dir\"]\n    dest = filedialog.askdirectory(\n        title=\"Select output folder for formatted files\",\n        mustexist=True,\n        initialdir=fallback_dir,\n    )\n    if not dest:\n        # Fall back to the first file's folder\n        dest_dir = Path(file_paths[0]).parent\n        messagebox.showinfo(\n            \"No folder selected\",\n            f\"No output folder chosen. Saving next to the first input file:\\n{dest_dir}\",\n            parent=root,\n        )\n    else:\n        dest_dir = Path(dest)\n\n    # Remember the output folder\n    prefs[\"last_output_dir\"] = str(dest_dir)\n    _save_prefs(prefs)\n\n    outputs, errors = run_batch([Path(p) for p in file_paths], month, dest_dir)\n\n    # Summarise results\n    msg_lines = [f\"Saved {len(outputs)} file(s) to:\\n{dest_dir}\"]\n    if outputs:\n        msg_lines.append(\"\")\n        msg_lines.extend(p.name for p in outputs)\n    if errors:\n        msg_lines.append(\"\\nSkipped with errors:\")\n        msg_lines.extend(errors)\n\n    messagebox.showinfo(\"Done\", \"\\n\".join(msg_lines), parent=root)\n\n\nif __name__ == \"__main__\":\n    main()", "paypal_customer": "\"\"\"\nprocess_csr_lt_month_express.py\n===============================\nTakes PayPal CSR CSV files where Date/Time are in the CSR time zone\n(e.g. America/Los_Angeles), converts them to Europe/Vilnius time and\nkeeps only the rows that:\n\n  - are customer payments (Description is \"Express Checkout Payment\" or\n    \"PreApproved Payment Bill User Payment\"), and\n  - fall into a user-chosen month (based on LT time).\n\nFeatures:\n- Multi-select: pick one or many CSR CSV files.\n- Choose output folder.\n- No overwrites: if a filename already exists, appends (2), (3), \u2026\n\nFor each input file, outputs ONE CSV named:\n    Tik klientu mokejimai pagal LT laiko zona.csv\n(or \"Tik klientu mokejimai pagal LT laiko zona (2).csv\", etc. if needed)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport sys\nimport tkinter as tk\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom tkinter import filedialog, messagebox, simpledialog\n\nimport pandas as pd\nfrom zoneinfo import ZoneInfo\n\n# ----------------------------------------------------------------------------\n# Configuration\n# ----------------------------------------------------------------------------\n\nDATE_COL = \"Date\"\nTIME_COL = \"Time\"\nTZ_COL = \"Time Zone\"\nDESC_COL = \"Description\"\n\n# PayPal migrated the customer checkout to billing-agreement payments during\n# July 2026: the last \"Express Checkout Payment\" row is 2026-07-04 and the first\n# \"PreApproved Payment Bill User Payment\" row is 2026-07-26. Both are ordinary\n# customer orders (positive gross, invoice ID), so both count. Matching is done\n# on the stripped value so stray whitespace in an export cannot drop every row.\nTARGET_DESCRIPTIONS = {\n    \"Express Checkout Payment\",\n    \"PreApproved Payment Bill User Payment\",\n}\n\nLT_TZ = ZoneInfo(\"Europe/Vilnius\")  # target timezone with DST rules\n\n# CSV-friendly datetime format, same style as other scripts\nDATE_FMT_OUT = \"%#m/%#d/%y %H:%M\" if sys.platform.startswith(\"win\") else \"%-m/%-d/%y %H:%M\"\n\n# Remembers last-used input/output folders between runs\n_CONFIG_PATH = Path(__file__).resolve().parent / \".customer_payments_prefs.json\"\n\n\n# ----------------------------------------------------------------------------\n# Persistent folder memory\n# ----------------------------------------------------------------------------\n\ndef _load_prefs() -> dict:\n    try:\n        return json.loads(_CONFIG_PATH.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, json.JSONDecodeError):\n        return {}\n\n\ndef _save_prefs(prefs: dict) -> None:\n    _CONFIG_PATH.write_text(json.dumps(prefs, indent=2), encoding=\"utf-8\")\n\n\n# ----------------------------------------------------------------------------\n# Utility: ensure unique filenames in the destination folder\n# ----------------------------------------------------------------------------\n\ndef _unique_path(path: Path) -> Path:\n    \"\"\"Return a path that does not yet exist, appending (2), (3), ... if needed.\"\"\"\n    if not path.exists():\n        return path\n    stem, suffix = path.stem, path.suffix\n    i = 2\n    while True:\n        candidate = path.with_name(f\"{stem} ({i}){suffix}\")\n        if not candidate.exists():\n            return candidate\n        i += 1\n\n\n@dataclass(slots=True)\nclass Cleaner:\n    \"\"\"Convert CSR times to LT time, filter by description + LT month, and sort.\"\"\"\n\n    df: pd.DataFrame\n    month: int  # 1\u201312\n\n    # ---------------------------------------------------------------------\n    def process(self) -> pd.DataFrame:\n        df = self.df.copy()\n\n        # Filter to Express Checkout Payment only -------------------------\n        if DESC_COL not in df.columns:\n            raise ValueError(f\"Column '{DESC_COL}' not found in CSR file.\")\n        df = df[df[DESC_COL].astype(str).str.strip().isin(TARGET_DESCRIPTIONS)]\n        if df.empty:\n            return df\n\n        # Parse and convert to LT time ------------------------------------\n        dt_lt = self._parse_and_convert_to_lt(df)\n\n        # Filter by LT month ----------------------------------------------\n        mask = dt_lt.dt.month.eq(self.month)\n        df = df[mask].copy()\n        dt_lt = dt_lt[mask]\n        if df.empty:\n            return df\n\n        # Sort chronologically by LT time ---------------------------------\n        df[\"__dt_lt__\"] = dt_lt\n        df = df.sort_values(\"__dt_lt__\")\n\n        # Expose a formatted LT datetime column ---------------------------\n        df[\"DateTime LT Laikas\"] = df[\"__dt_lt__\"].dt.strftime(DATE_FMT_OUT)\n\n        return df.drop(columns=\"__dt_lt__\")\n\n    # ---------------------------------------------------------------- helper\n    def _parse_and_convert_to_lt(self, df: pd.DataFrame) -> pd.Series:\n        \"\"\"\n        Combine Date + Time, interpret them in the CSR time zone from TZ_COL,\n        and convert to Europe/Vilnius.\n\n        Uses Python's zoneinfo on each timestamp, which avoids the pandas\n        tz_localize() ambiguity error at DST transitions.\n        \"\"\"\n        # Combine Date + Time as strings\n        combined = (\n            df[DATE_COL].astype(str).str.strip()\n            + \" \"\n            + df[TIME_COL].astype(str).str.strip()\n        )\n\n        # Parse naive datetimes (CSR uses m/d/Y H:M:S)\n        dt_naive = pd.to_datetime(\n            combined,\n            format=\"%m/%d/%Y %H:%M:%S\",\n            errors=\"coerce\",\n        )\n        if dt_naive.isna().any():\n            bad = combined[dt_naive.isna()].head().tolist()\n            raise ValueError(\n                \"Unparsable Date/Time values (samples): \" + \", \".join(map(str, bad))\n            )\n\n        # Detect source timezone from the file (e.g. \"America/Los_Angeles\")\n        if TZ_COL not in df.columns:\n            raise ValueError(f\"Column '{TZ_COL}' not found in CSR file.\")\n\n        tz_values = df[TZ_COL].dropna().unique()\n        if len(tz_values) == 0:\n            raise ValueError(\"No non-empty values found in 'Time Zone' column.\")\n        src_tz_name = str(tz_values[0])\n        try:\n            src_tz = ZoneInfo(src_tz_name)\n        except Exception as exc:  # noqa: BLE001\n            raise ValueError(f\"Unknown time zone {src_tz_name!r}: {exc}\") from exc\n\n        # Convert each timestamp using Python's zoneinfo directly ----------\n        lt_list = []\n        for ts in dt_naive:\n            # ts is a pandas Timestamp (naive); convert to Python datetime\n            py = ts.to_pydatetime().replace(tzinfo=src_tz)\n            lt_list.append(py.astimezone(LT_TZ))\n\n        return pd.Series(lt_list, index=df.index)\n\n\n# ----------------------------------------------------------------------------\n# Core logic\n# ----------------------------------------------------------------------------\n\ndef run_one(src_path: Path, month: int, dest_dir: Path) -> list[Path]:\n    \"\"\"Process a single CSR CSV. Returns list of output file paths (0 or 1).\"\"\"\n    df_all = pd.read_csv(src_path)\n\n    cleaned = Cleaner(df_all, month).process()\n    if cleaned.empty:\n        # Nothing matching filters in that LT month; no output file\n        return []\n\n    # Always use the same base filename\n    base_name = \"Tik klientu mokejimai pagal LT laiko zona.csv\"\n    out_path = _unique_path(dest_dir / base_name)\n    cleaned.to_csv(out_path, index=False, encoding=\"utf-8-sig\")\n    return [out_path]\n\n\ndef run_batch(file_paths: list[Path], month: int, dest_dir: Path) -> tuple[list[Path], list[str]]:\n    \"\"\"Process multiple files; collect outputs and any error messages.\"\"\"\n    outputs: list[Path] = []\n    errors: list[str] = []\n    for p in file_paths:\n        try:\n            outputs.extend(run_one(p, month, dest_dir))\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f\"\\u2716 {p.name}: {exc}\")\n    return outputs, errors\n\n\n# ----------------------------------------------------------------------------\n# Tiny Tkinter UI (multi-select + choose output folder) -----------------------\n# ----------------------------------------------------------------------------\n\ndef main() -> None:\n    root = tk.Tk()\n    root.withdraw()  # dialogs only\n\n    prefs = _load_prefs()\n\n    # Pick one or many CSR CSV files (start from last-used input folder)\n    file_paths = filedialog.askopenfilenames(\n        title=\"Select one or more PayPal CSR CSV files\",\n        filetypes=[(\"CSV files\", \"*.csv\"), (\"All files\", \"*.*\")],\n        initialdir=prefs.get(\"last_input_dir\"),\n    )\n    if not file_paths:\n        return  # user cancelled\n\n    # Remember where the user picked files from\n    prefs[\"last_input_dir\"] = str(Path(file_paths[0]).parent)\n\n    # Ask for LT month number\n    month = simpledialog.askinteger(\n        \"Pick month (LT time)\",\n        \"Enter month number (1\u201312) to retain (based on LT time):\",\n        parent=root,\n        minvalue=1,\n        maxvalue=12,\n    )\n    if month is None:\n        return\n\n    # Choose destination folder (start from last-used output folder,\n    # or fall back to where the input files live)\n    fallback_dir = prefs.get(\"last_output_dir\") or prefs[\"last_input_dir\"]\n    dest = filedialog.askdirectory(\n        title=\"Select output folder for formatted files\",\n        mustexist=True,\n        initialdir=fallback_dir,\n    )\n    if not dest:\n        # Fall back to the first file's folder\n        dest_dir = Path(file_paths[0]).parent\n        messagebox.showinfo(\n            \"No folder selected\",\n            f\"No output folder chosen. Saving next to the first input file:\\n{dest_dir}\",\n            parent=root,\n        )\n    else:\n        dest_dir = Path(dest)\n\n    # Remember the output folder\n    prefs[\"last_output_dir\"] = str(dest_dir)\n    _save_prefs(prefs)\n\n    outputs, errors = run_batch([Path(p) for p in file_paths], month, dest_dir)\n\n    # Summarise results\n    msg_lines = [f\"Saved {len(outputs)} file(s) to:\\n{dest_dir}\"]\n    if outputs:\n        msg_lines.append(\"\")\n        msg_lines.extend(p.name for p in outputs)\n    if errors:\n        msg_lines.append(\"\\nSkipped with errors:\")\n        msg_lines.extend(errors)\n\n    messagebox.showinfo(\"Done\", \"\\n\".join(msg_lines), parent=root)\n\n\nif __name__ == \"__main__\":\n    main()", "gisko_sales": "\"\"\"\nGisko MB monthly sales report generator.\n\nTakes two Shopify CSV exports and produces a formatted Excel report\nwith per-payment-method amount splits for Agn\u0117.\n\nInputs:\n  orders_csv:       Shopify Orders export\n                    (Admin \u2192 Orders \u2192 Export \u2192 \"Export orders\" \u2192 CSV)\n  transactions_csv: Shopify Transaction histories export\n                    (Admin \u2192 Orders \u2192 Export \u2192 \"Export transaction histories\" \u2192 CSV)\n\nOutput:\n  xlsx with one row per order. Single-gateway orders have only\n  \"Apmok\u0117jimo b\u016bdas (1)\" + \"Suma USD (1)\" filled. Mixed-payment orders\n  fill both gateway columns and are highlighted yellow. Refunded /\n  cancelled orders are highlighted red.\n\nUsage (CLI):\n  python build_sales_report.py orders.csv transactions.csv output.xlsx\n  python build_sales_report.py orders.csv transactions.csv output.xlsx --period \"2026-05\"\n\nWeb UI entry point:\n  gisko_sales.run(orders_csv, transactions_csv, output_xlsx, period=\"\")\n\"\"\"\n\nimport argparse\nimport os\nimport pandas as pd\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Font, PatternFill, Alignment, Border, Side\nfrom openpyxl.utils import get_column_letter\n\n\nGATEWAY_MAP = {\n    \"shopify_payments\": \"Shopify Payments\",\n    \"paypal\": \"PayPal Express Checkout\",\n    \"Airwallex Klarna\": \"Airwallex Klarna\",\n    \"gift_card\": \"Gift Card\",\n    \"Airwallex - Cards and Local Payment Methods\": \"Airwallex Cards\",\n    \"shop_cash\": \"Shop Cash\",\n    \"manual\": \"Manual\",\n}\n\n\ndef parse_dt(s):\n    if pd.isna(s):\n        return None\n    try:\n        return pd.to_datetime(s).tz_localize(None)\n    except Exception:\n        return None\n\n\ndef build_payment_splits(transactions_csv):\n    \"\"\"For each order, returns list of (gateway, total_captured) in chronological order.\n    Only successful sale/capture transactions are counted.\"\"\"\n    tx = pd.read_csv(transactions_csv, low_memory=False)\n    settled = tx[(tx[\"Kind\"].isin([\"sale\", \"capture\"])) & (tx[\"Status\"] == \"success\")].copy()\n    settled[\"Gateway_Friendly\"] = settled[\"Gateway\"].map(lambda g: GATEWAY_MAP.get(g, g))\n\n    def aggregate(group):\n        g = group.sort_values(\"Created At\")\n        sums = {}\n        order_seq = []\n        for _, row in g.iterrows():\n            gw = row[\"Gateway_Friendly\"]\n            if gw not in sums:\n                sums[gw] = 0\n                order_seq.append(gw)\n            sums[gw] += row[\"Amount\"]\n        return [(gw, sums[gw]) for gw in order_seq]\n\n    return settled.groupby(\"Name\").apply(aggregate, include_groups=False).to_dict()\n\n\ndef build_orders_frame(orders_csv, splits):\n    \"\"\"Load orders CSV, filter to one row per order, attach payment splits.\"\"\"\n    df = pd.read_csv(orders_csv, low_memory=False)\n    orders = df[df[\"Financial Status\"].notna()].copy()\n    orders[\"Created_dt\"] = orders[\"Created at\"].apply(parse_dt)\n    orders[\"Paid_dt\"] = orders[\"Paid at\"].apply(parse_dt)\n    orders[\"Cancelled_dt\"] = orders[\"Cancelled at\"].apply(parse_dt)\n    orders = orders.sort_values(\"Created_dt\").reset_index(drop=True)\n\n    def get_split(name):\n        parts = splits.get(name, [])\n        m1 = parts[0][0] if len(parts) > 0 else \"\"\n        a1 = parts[0][1] if len(parts) > 0 else 0\n        m2 = parts[1][0] if len(parts) > 1 else \"\"\n        a2 = parts[1][1] if len(parts) > 1 else 0\n        return m1, a1, m2, a2\n\n    orders[[\"M1\", \"A1\", \"M2\", \"A2\"]] = orders[\"Name\"].apply(lambda n: pd.Series(get_split(n)))\n    return orders\n\n\ndef write_xlsx(orders, output_path, period_label):\n    wb = Workbook()\n    ws = wb.active\n    # Excel sheet title max 31 chars\n    sheet_title = f\"Pardavimai {period_label}\" if period_label else \"Pardavimai\"\n    ws.title = sheet_title[:31]\n\n    HEADER_FILL = PatternFill(\"solid\", start_color=\"1F2937\")\n    HEADER_FONT = Font(name=\"Arial\", bold=True, color=\"FFFFFF\", size=10)\n    BODY_FONT = Font(name=\"Arial\", size=10)\n    TOTAL_FONT = Font(name=\"Arial\", bold=True, size=10)\n    TOTAL_FILL = PatternFill(\"solid\", start_color=\"E5E7EB\")\n    SPLIT_FILL = PatternFill(\"solid\", start_color=\"FEF3C7\")\n    RED_FILL = PatternFill(\"solid\", start_color=\"FEE2E2\")\n    THIN = Side(border_style=\"thin\", color=\"D1D5DB\")\n    BORDER = Border(left=THIN, right=THIN, top=THIN, bottom=THIN)\n    CENTER = Alignment(horizontal=\"center\", vertical=\"center\")\n    LEFT = Alignment(horizontal=\"left\", vertical=\"center\")\n    RIGHT = Alignment(horizontal=\"right\", vertical=\"center\")\n\n    ws[\"A1\"] = \"GISKO MB - Pardavim\u0173 ataskaita\"\n    ws[\"A1\"].font = Font(name=\"Arial\", bold=True, size=14)\n    ws.merge_cells(\"A1:U1\")\n\n    ws[\"A2\"] = (\n        f\"Laikotarpis: {period_label} \u00b7 Operacij\u0173: {len(orders)} \u00b7 \"\n        f\"Apmok\u0117jimo b\u016bdai i\u0161 s\u0117kming\u0173 tranzakcij\u0173 (kind=sale/capture, status=success) \u00b7 \"\n        f\"Geltonai pa\u017eym\u0117tos eilut\u0117s: mi\u0161rus apmok\u0117jimas\"\n    )\n    ws[\"A2\"].font = Font(name=\"Arial\", italic=True, size=9, color=\"6B7280\")\n    ws.merge_cells(\"A2:U2\")\n\n    headers = [\n        \"Eil. Nr.\", \"Dokumento Nr.\", \"Order ID\", \"Sukurta\", \"Apmok\u0117ta\",\n        \"Pirk\u0117jas\", \"El. pa\u0161tas\", \"\u0160alis\", \"Miestas\", \"Valiuta\",\n        \"Suma be PVM\", \"Pristatymas\", \"Mokes\u010diai / PVM\", \"Viso\", \"Gr\u0105\u017einta\",\n        \"Apmok\u0117jimo b\u016bdas (1)\", \"Suma USD (1)\", \"Apmok\u0117jimo b\u016bdas (2)\", \"Suma USD (2)\",\n        \"Statusas\", \"At\u0161aukta\",\n    ]\n    HEADER_ROW = 4\n    for col_idx, h in enumerate(headers, start=1):\n        c = ws.cell(row=HEADER_ROW, column=col_idx, value=h)\n        c.font = HEADER_FONT\n        c.fill = HEADER_FILL\n        c.alignment = CENTER\n        c.border = BORDER\n\n    for i in range(len(orders)):\n        o = orders.iloc[i]\n        r = HEADER_ROW + 1 + i\n        has_split = bool(o[\"M2\"])\n        vals = [\n            i + 1,\n            o[\"Name\"],\n            int(o[\"Id\"]) if pd.notna(o[\"Id\"]) else None,\n            o[\"Created_dt\"],\n            o[\"Paid_dt\"],\n            o[\"Billing Name\"] if pd.notna(o[\"Billing Name\"]) else \"\",\n            o[\"Email\"] if pd.notna(o[\"Email\"]) else \"\",\n            o[\"Billing Country\"] if pd.notna(o[\"Billing Country\"]) else \"\",\n            o[\"Billing City\"] if pd.notna(o[\"Billing City\"]) else \"\",\n            o[\"Currency\"],\n            float(o[\"Subtotal\"]) if pd.notna(o[\"Subtotal\"]) else 0,\n            float(o[\"Shipping\"]) if pd.notna(o[\"Shipping\"]) else 0,\n            float(o[\"Taxes\"]) if pd.notna(o[\"Taxes\"]) else 0,\n            float(o[\"Total\"]) if pd.notna(o[\"Total\"]) else 0,\n            float(o[\"Refunded Amount\"]) if pd.notna(o[\"Refunded Amount\"]) else 0,\n            o[\"M1\"],\n            float(o[\"A1\"]) if o[\"A1\"] else 0,\n            o[\"M2\"] if has_split else \"\",\n            float(o[\"A2\"]) if has_split and o[\"A2\"] else None,\n            o[\"Financial Status\"] if pd.notna(o[\"Financial Status\"]) else \"\",\n            o[\"Cancelled_dt\"],\n        ]\n        for col_idx, v in enumerate(vals, start=1):\n            c = ws.cell(row=r, column=col_idx, value=v)\n            c.font = BODY_FONT\n            c.border = BORDER\n            if col_idx == 1:\n                c.alignment = CENTER\n            elif col_idx in (11, 12, 13, 14, 15, 17, 19):\n                c.alignment = RIGHT\n                c.number_format = \"#,##0.00\"\n            elif col_idx in (4, 5, 21):\n                c.alignment = CENTER\n                c.number_format = \"yyyy-mm-dd hh:mm\"\n            elif col_idx in (8, 10):\n                c.alignment = CENTER\n            else:\n                c.alignment = LEFT\n        if has_split:\n            for col_idx in range(1, 22):\n                ws.cell(row=r, column=col_idx).fill = SPLIT_FILL\n        status = o[\"Financial Status\"]\n        cancelled = pd.notna(o[\"Cancelled_dt\"])\n        if status in (\"refunded\", \"partially_refunded\") or cancelled:\n            for col_idx in range(1, 22):\n                ws.cell(row=r, column=col_idx).fill = RED_FILL\n\n    total_row = HEADER_ROW + 1 + len(orders)\n    first_data = HEADER_ROW + 1\n    last_data = total_row - 1\n    label_cell = ws.cell(row=total_row, column=2, value=\"VISO\")\n    label_cell.font = TOTAL_FONT\n    label_cell.fill = TOTAL_FILL\n    label_cell.alignment = RIGHT\n    label_cell.border = BORDER\n    for col_idx in (1, 3, 4, 5, 6, 7, 8, 9, 10, 16, 18, 20, 21):\n        c = ws.cell(row=total_row, column=col_idx)\n        c.fill = TOTAL_FILL\n        c.border = BORDER\n    for col_idx in (11, 12, 13, 14, 15, 17, 19):\n        col_letter = get_column_letter(col_idx)\n        c = ws.cell(row=total_row, column=col_idx, value=f\"=SUM({col_letter}{first_data}:{col_letter}{last_data})\")\n        c.font = TOTAL_FONT\n        c.fill = TOTAL_FILL\n        c.alignment = RIGHT\n        c.number_format = \"#,##0.00\"\n        c.border = BORDER\n\n    widths = {\n        \"A\": 7, \"B\": 12, \"C\": 14, \"D\": 18, \"E\": 18, \"F\": 26, \"G\": 30, \"H\": 8,\n        \"I\": 18, \"J\": 8, \"K\": 12, \"L\": 11, \"M\": 14, \"N\": 12, \"O\": 11,\n        \"P\": 22, \"Q\": 13, \"R\": 22, \"S\": 13, \"T\": 18, \"U\": 18,\n    }\n    for col, w in widths.items():\n        ws.column_dimensions[col].width = w\n\n    ws.freeze_panes = \"C5\"\n    ws.auto_filter.ref = f\"A{HEADER_ROW}:U{last_data}\"\n\n    wb.save(output_path)\n\n\ndef run(orders_csv, transactions_csv, output_xlsx, period=\"\"):\n    \"\"\"Programmatic entry point used by the web UI.\n\n    Returns the output path. Mirrors main() but without argparse / console I/O.\n    \"\"\"\n    splits = build_payment_splits(transactions_csv)\n    orders = build_orders_frame(orders_csv, splits)\n    write_xlsx(orders, output_xlsx, period)\n    return output_xlsx\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Build Gisko MB monthly sales report\")\n    parser.add_argument(\"orders_csv\", help=\"Shopify Orders export CSV\")\n    parser.add_argument(\"transactions_csv\", help=\"Shopify Transaction histories export CSV\")\n    parser.add_argument(\"output_xlsx\", help=\"Output Excel file path\")\n    parser.add_argument(\"--period\", default=\"\", help=\"Period label, e.g. '2026-05-01 to 2026-05-31'\")\n    args = parser.parse_args()\n\n    splits = build_payment_splits(args.transactions_csv)\n    orders = build_orders_frame(args.orders_csv, splits)\n    write_xlsx(orders, args.output_xlsx, args.period)\n\n    # Quick summary printed to console\n    print(f\"Saved: {args.output_xlsx}\")\n    print(f\"Operations: {len(orders)}\")\n    print(f\"Gross revenue: ${orders['Total'].sum():,.2f}\")\n    print(f\"Refunded: ${orders['Refunded Amount'].sum():,.2f}\")\n    mixed = (orders[\"M2\"] != \"\").sum()\n    print(f\"Mixed-payment orders: {mixed}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"};

# Emscripten libc doesn't support GNU %-m / %-d strftime extensions.
# Substitute them per-element before delegating to libc, so the scripts'
# original "6/1/25 17:08" output format is preserved verbatim.
import pandas as pd
from pandas.core.indexes.accessors import DatetimeProperties
_orig_strftime = DatetimeProperties.strftime
def _strftime_gnu(self, date_format):
    if '%-m' in date_format or '%-d' in date_format:
        def _fmt(ts):
            if pd.isna(ts):
                return None
            f = date_format.replace('%-m', str(ts.month)).replace('%-d', str(ts.day))
            return ts.strftime(f)
        return pd.Series(self._parent).map(_fmt)
    return _orig_strftime(self, date_format)
DatetimeProperties.strftime = _strftime_gnu
`);

  pyodide.FS.mkdirTree("/scripts");
  for (const name of MODULE_FILES) {
    pyodide.FS.writeFile(`/scripts/${name}.py`, EMBEDDED_SCRIPTS[name]);
  }

  await pyodide.runPython(`
import sys
if '/scripts' not in sys.path:
    sys.path.insert(0, '/scripts')
import airwallex_transactions, airwallex_frozen, paypal_all, paypal_customer, gisko_sales
`);

  setStatus("Ready", "ready");
}

function startPyodide() {
  if (!pyodideReady) {
    pyodideReady = initPyodide().catch((err) => {
      console.error(err);
      setStatus("Python failed to load", "error");
      throw err;
    });
  }
  return pyodideReady;
}

// ---------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") {
      e.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== false && v != null) {
      e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}

function render() {
  const hash = location.hash || "#/";
  view.innerHTML = "";

  if (hash === "#/" || hash === "") {
    view.append(renderHome());
  } else if (hash === "#/paypal") {
    view.append(renderVendor("PayPal", "paypal"));
  } else if (hash === "#/airwallex") {
    view.append(renderVendor("Airwallex", "airwallex"));
  } else if (hash.startsWith("#/run/")) {
    const key = hash.slice("#/run/".length);
    if (FORMATTERS[key]) {
      view.append(renderRun(key));
    } else {
      view.append(el("p", {}, "Unknown formatter."));
    }
  } else {
    view.append(el("p", {}, "Not found."));
  }
}

function renderHome() {
  const root = el("section", { class: "hero" });
  root.append(
    el("h1", {}, "CSV Formatter"),
    el("p", { class: "lede" }, "Pick a source to format."),
  );
  const grid = el("div", { class: "card-grid" });
  grid.append(
    el("a", { class: "card", href: "#/paypal" },
      el("h2", {}, "Format PayPal docs"),
      el("p", {}, "All transactions · Customer payments only"),
    ),
    el("a", { class: "card", href: "#/airwallex" },
      el("h2", {}, "Format Airwallex docs"),
      el("p", {}, "Transactions · Frozen funds (Užšaldytos)"),
    ),
    el("a", { class: "card", href: "#/run/gisko-sales" },
      el("h2", {}, "Gisko sales report"),
      el("p", {}, "Shopify Orders + Transactions → formatted Excel"),
    ),
  );
  root.append(grid);
  return root;
}

function renderVendor(label, vendor) {
  const root = el("section");
  root.append(el("h1", {}, label), el("p", { class: "lede" }, "Choose a formatter."));
  const grid = el("div", { class: "card-grid" });
  for (const [key, cfg] of Object.entries(FORMATTERS)) {
    if (cfg.vendor !== vendor) continue;
    const shortTitle = cfg.title.split("—")[1].trim();
    grid.append(
      el("a", { class: "card", href: `#/run/${key}` },
        el("h2", {}, shortTitle),
        el("p", {}, cfg.description),
      ),
    );
  }
  root.append(grid);
  root.append(el("p", {}, el("a", { class: "back", href: "#/" }, "← Back")));
  return root;
}

function renderRun(key) {
  const cfg = FORMATTERS[key];
  const root = el("section");
  root.append(el("h1", {}, cfg.title), el("p", { class: "lede" }, cfg.description));

  const form = el("form", { class: "run-form" });

  for (const ff of cfg.fileFields) {
    const fileLabel = el("label", { class: "field" });
    fileLabel.append(
      el("span", {}, ff.label),
      el("input", {
        type: "file",
        name: ff.key,
        accept: ff.accept || ".csv",
        multiple: ff.multiple ? "" : false,
      }),
      ff.hint ? el("small", {}, ff.hint) : null,
    );
    form.append(fileLabel);
  }

  for (const pr of cfg.params) {
    const lbl = el("label", { class: "field" });
    const input =
      pr.type === "number"
        ? el("input", {
            type: "number",
            name: pr.key,
            min: pr.min,
            max: pr.max,
            required: pr.required ? "" : false,
          })
        : el("input", {
            type: "text",
            name: pr.key,
            placeholder: pr.placeholder || "",
            required: pr.required ? "" : false,
          });
    lbl.append(el("span", {}, pr.label), input);
    form.append(lbl);
  }

  const submit = el("button", { type: "submit" }, "Format & download");
  const back = el("a", { class: "back", href: cfg.backHref || `#/${cfg.vendor}` }, "← Back");
  const actions = el("div", { class: "actions" }, submit, back);
  form.append(actions);

  const message = el("div");
  form.append(message);

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    message.className = "";
    message.textContent = "";

    const fail = (msg) => {
      message.className = "message error";
      message.textContent = msg;
    };

    // Collect files per field
    const fieldFiles = {};
    for (const ff of cfg.fileFields) {
      const input = form.querySelector(`input[type="file"][name="${ff.key}"]`);
      const files = Array.from(input.files || []);
      if (files.length === 0) {
        fail(`Please select a file: ${ff.label}`);
        return;
      }
      fieldFiles[ff.key] = files;
    }

    // Collect + validate params
    const params = {};
    for (const pr of cfg.params) {
      const input = form.querySelector(`[name="${pr.key}"]`);
      if (pr.type === "number") {
        const v = parseInt(input.value, 10);
        if (pr.min != null && pr.max != null && !(v >= pr.min && v <= pr.max)) {
          fail(`${pr.label} must be ${pr.min}–${pr.max}.`);
          return;
        }
        params[pr.key] = v;
      } else {
        const v = (input.value || "").trim();
        if (pr.required && !v) {
          fail(`${pr.label} is required.`);
          return;
        }
        params[pr.key] = v;
      }
    }

    submit.disabled = true;
    message.className = "message info";
    message.textContent = "Loading Python (first run takes ~15 seconds)…";

    try {
      await startPyodide();
      message.textContent = "Processing…";
      const result = await runFormatter(key, fieldFiles, params);
      if (result.outputs.length === 0) {
        // Never report success for an empty run: say so, and show what was in
        // the input so the cause is visible instead of silently producing nothing.
        message.className = "message error";
        const lines = ["No output produced \u2014 0 rows matched."];
        if (result.errors.length) lines.push(result.errors.join("\n"));
        const seen = await describeInputs();
        if (seen.length) {
          lines.push("", "Description values found in the uploaded file(s):");
          for (const s of seen) lines.push("\u2022 " + s);
        }
        message.textContent = lines.join("\n");
      } else {
        triggerDownload(result);
        message.className = "message ok";
        const lines = [`Saved ${result.outputs.length} file(s).`];
        for (const o of result.outputs) lines.push("• " + o.name);
        if (result.errors.length) lines.push("\nWarnings:\n" + result.errors.join("\n"));
        message.textContent = lines.join("\n");
      }
    } catch (err) {
      console.error(err);
      message.className = "message error";
      message.textContent = "Error: " + (err.message || String(err));
    } finally {
      submit.disabled = false;
    }
  });

  root.append(form);
  return root;
}

// ---------------------------------------------------------------------------
// Pyodide invocation
// ---------------------------------------------------------------------------

async function runFormatter(key, fieldFiles, params) {
  const cfg = FORMATTERS[key];

  // Reset working dirs
  pyodide.runPython(`
import shutil
from pathlib import Path
for d in ['/work/in', '/work/out']:
    p = Path(d)
    if p.exists():
        shutil.rmtree(p)
    p.mkdir(parents=True)
`);

  // Write uploaded files, grouped per field to avoid name collisions
  const fsPaths = {};
  for (const ff of cfg.fileFields) {
    fsPaths[ff.key] = [];
    pyodide.FS.mkdirTree(`/work/in/${ff.key}`);
    for (const f of fieldFiles[ff.key]) {
      const buf = new Uint8Array(await f.arrayBuffer());
      const p = `/work/in/${ff.key}/${f.name}`;
      pyodide.FS.writeFile(p, buf);
      fsPaths[ff.key].push(p);
    }
  }

  // Render python literals: file paths as JSON arrays (valid Python list of str),
  // number params bare, text params JSON-quoted.
  const f = {};
  for (const k in fsPaths) f[k] = JSON.stringify(fsPaths[k]);
  const p = {};
  for (const pr of cfg.params) {
    p[pr.key] = pr.type === "number" ? params[pr.key] : JSON.stringify(params[pr.key] ?? "");
  }

  const body = cfg.pyInvoke(f, p);
  const code = `
from pathlib import Path
import ${cfg.module}
out_dir = Path('/work/out')
${body}
([str(x) for x in outputs], list(errors))
`;

  const result = await pyodide.runPythonAsync(code);
  const [outPaths, errors] = result.toJs({ create_proxies: false });
  result.destroy();

  const mime = cfg.output === "xlsx" ? XLSX_MIME : "text/csv";
  const outputs = outPaths.map((pp) => {
    const bytes = pyodide.FS.readFile(pp);
    const name = pp.split("/").pop();
    return { name, bytes, type: mime };
  });

  return { outputs, errors };
}

// Diagnostic for empty runs: list the distinct Description values present in the
// uploaded CSVs. /work/in still holds them until the next run resets it.
async function describeInputs() {
  try {
    const res = await pyodide.runPythonAsync(`
import pandas as pd
from pathlib import Path
seen = {}
for p in sorted(Path('/work/in').rglob('*')):
    if not p.is_file() or p.suffix.lower() != '.csv':
        continue
    try:
        d = pd.read_csv(p)
    except Exception:
        continue
    if 'Description' not in d.columns:
        continue
    for k, v in d['Description'].astype(str).str.strip().value_counts().items():
        seen[k] = seen.get(k, 0) + int(v)
[f"{k} ({v})" for k, v in sorted(seen.items(), key=lambda kv: -kv[1])]
`);
    const out = res.toJs({ create_proxies: false });
    res.destroy();
    return out;
  } catch (err) {
    console.error(err);
    return [];
  }
}

function triggerDownload({ outputs, errors }) {
  if (outputs.length === 1 && errors.length === 0) {
    const o = outputs[0];
    downloadBlob(new Blob([o.bytes], { type: o.type }), o.name);
    return;
  }
  outputs.forEach((o, i) => {
    setTimeout(() => downloadBlob(new Blob([o.bytes], { type: o.type }), o.name), i * 200);
  });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

window.addEventListener("hashchange", render);
render();
// Eagerly start loading Pyodide in the background so it's ready when needed.
startPyodide();

  </script>
