name: Publish site

# Bundles src/ into a single self-contained page and promotes it to docs/,
# which is what GitHub Pages serves. The site is NOT password-protected.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle src/ into build/index.html
        run: |
          python3 build.py
          test -s build/index.html

      - name: Promote to docs/ and commit
        run: |
          cp build/index.html docs/index.html
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html unchanged — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Rebuild site [skip ci]"
          git push
